services:
  - type: web
    name: predictive-policing
    env: node
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install
    startCommand: cd server && node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DB_URL
        sync: false # Add your MongoDB URL in Render dashboard
    routes:
      - type: rewrite
        source: /*
        destination: /index.html